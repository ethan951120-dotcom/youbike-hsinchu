name: Collect YouBike data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch data every 10 minutes (6 times)
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          git config user.name "youbike-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            python collect.py || echo "fetch failed, skip this round"
            git add data/
            git diff --cached --quiet || git commit -m "data $(TZ=Asia/Taipei date +'%F %H:%M')"
            git pull --rebase && git push || echo "push failed, retry next round"
            if [ $i -lt 6 ]; then sleep 540; fi
          done
